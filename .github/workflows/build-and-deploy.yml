name: Build and Deploy Container

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:

env:
  AWS_REGION: eu-north-1
  CONTAINER_SERVICE_NAME: c2c-order-grabber

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/c2c-order-grabber
          tags: |
            type=raw,value=latest
            type=sha,prefix={{branch}}-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/c2c-order-grabber:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/c2c-order-grabber:buildcache,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install AWS Lightsail plugin
        run: |
          curl "https://s3.us-west-2.amazonaws.com/lightsailctl/latest/linux-amd64/lightsailctl" -o "/usr/local/bin/lightsailctl"
          sudo chmod +x /usr/local/bin/lightsailctl

      - name: Create container deployment
        run: |
          cat > containers.json << EOF
          {
            "c2c-bot": {
              "image": "${{ secrets.DOCKERHUB_USERNAME }}/c2c-order-grabber:latest",
              "environment": {
                "TELEGRAM_BOT_TOKEN": "${{ secrets.TELEGRAM_BOT_TOKEN }}",
                "ADMIN_CHAT_ID": "${{ secrets.ADMIN_CHAT_ID }}",
                "INVITE_CODE": "${{ secrets.INVITE_CODE }}",
                "AWS_REGION": "us-east-1",
                "COGNITO_CLIENT_ID": "6eio0hlq4tmr2o9d30ht9cvfn7",
                "COGNITO_USER_POOL_ID": "us-east-1_9szPtqd8w",
                "COGNITO_IDENTITY_POOL_ID": "us-east-1:db254d71-fe90-4631-bee5-d7ed0a489588",
                "HTTP_PROXY": "${{ secrets.HTTP_PROXY }}",
                "HTTPS_PROXY": "${{ secrets.HTTPS_PROXY }}",
                "DATABASE_URL": "sqlite+aiosqlite:///./data/bot.db",
                "LOG_FILE": "bot.log"
              }
            }
          }
          EOF

          aws lightsail create-container-service-deployment \
            --service-name ${{ env.CONTAINER_SERVICE_NAME }} \
            --containers file://containers.json \
            --region ${{ env.AWS_REGION }}

      - name: Wait for deployment
        run: |
          echo "Waiting for deployment to complete..."
          sleep 30

          aws lightsail get-container-services \
            --service-name ${{ env.CONTAINER_SERVICE_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query 'containerServices[0].state' \
            --output text

      - name: Get deployment info
        run: |
          echo "=== Deployment Information ==="
          aws lightsail get-container-services \
            --service-name ${{ env.CONTAINER_SERVICE_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --query 'containerServices[0].{Name:containerServiceName,State:state,Power:power,Scale:scale,URL:url}' \
            --output table

      - name: Deployment notification
        if: success()
        run: |
          echo "Container deployment successful!"
          echo "Service: ${{ env.CONTAINER_SERVICE_NAME }}"
          echo "Image: ${{ secrets.DOCKERHUB_USERNAME }}/c2c-order-grabber:latest"

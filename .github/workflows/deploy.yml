name: Deploy to AWS Lightsail

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'deploy/terraform/**'
      - '**.md'
      - '.github/workflows/terraform.yml'
  workflow_dispatch: # Manual trigger
  workflow_run:
    workflows: ["Terraform Infrastructure"]
    types:
      - completed

env:
  AWS_REGION: eu-north-1
  INSTANCE_NAME: c2c-order-grabber

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Only run if triggered by push/manual OR if terraform workflow succeeded
    if: |
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get Lightsail instance IP
        id: get-ip
        run: |
          INSTANCE_IP=$(aws lightsail get-instance \
            --instance-name ${{ env.INSTANCE_NAME }} \
            --query 'instance.publicIpAddress' \
            --output text)
          echo "instance_ip=$INSTANCE_IP" >> $GITHUB_OUTPUT

      - name: Setup SSH key
        run: |
          echo "${{ secrets.LIGHTSAIL_SSH_KEY }}" > private_key.pem
          chmod 600 private_key.pem

      - name: Wait for cloud-init to complete
        env:
          INSTANCE_IP: ${{ steps.get-ip.outputs.instance_ip }}
        run: |
          echo "Waiting for cloud-init to complete..."
          timeout 300 bash -c '
            until ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 -i private_key.pem ubuntu@$INSTANCE_IP "cloud-init status --wait" 2>/dev/null; do
              echo "Still waiting for cloud-init..."
              sleep 10
            done
          '
          echo "Cloud-init completed!"

          # Verify c2cbot user exists
          ssh -o StrictHostKeyChecking=no -i private_key.pem ubuntu@$INSTANCE_IP "id c2cbot"

      - name: Update code on server
        env:
          INSTANCE_IP: ${{ steps.get-ip.outputs.instance_ip }}
        run: |
          ssh -o StrictHostKeyChecking=no -i private_key.pem ubuntu@$INSTANCE_IP << 'ENDSSH'
            set -e

            # Pull latest code as c2cbot user
            sudo -u c2cbot bash -c 'cd /home/c2cbot/c2c-order-grabber && git fetch origin && git reset --hard origin/main'

            # Update dependencies if requirements.txt changed
            if sudo -u c2cbot bash -c 'cd /home/c2cbot/c2c-order-grabber && git diff HEAD@{1} --name-only' | grep -q requirements.txt; then
              sudo -u c2cbot bash -c 'cd /home/c2cbot/c2c-order-grabber && venv/bin/pip install -r requirements.txt'
            fi

            # Restart service
            sudo systemctl restart c2c-bot.service

            # Show status
            sleep 3
            sudo systemctl status c2c-bot.service --no-pager
          ENDSSH

      - name: Cleanup
        if: always()
        run: |
          rm -f private_key.pem

      - name: Deployment notification
        if: success()
        run: |
          echo "Deployment successful!"
          echo "Instance IP: ${{ steps.get-ip.outputs.instance_ip }}"
